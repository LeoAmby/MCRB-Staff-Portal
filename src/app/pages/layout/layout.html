<div class="d-flex" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- SIDEBAR -->
  <aside class="app-sidebar">

    <!-- Brand -->
    <div class="d-flex align-items-center justify-content-between mb-4 px-2">

      <a href="#" class="brand">
        <span class="brand__mark">MCRB</span>
        <span>Staff Portal</span>
      </a>

    </div>


    <!-- Navigation -->
    <nav class="nav-side">

      <div class="nav-side__label">
        Main
      </div>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-side__link"
      >
        <span>⌂</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/admin/employee-list"
        routerLinkActive="active"
        class="nav-side__link"
      >
        <span>♙</span>
        <span>Employees</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>▣</span>
        <span>Departments</span>
      </a>

      <a
        routerLink="/admin/projects"
        routerLinkActive="active"
        class="nav-side__link"
      >
        <span>▤</span>
        <span>Projects</span>
      </a>


      <div class="nav-side__label">
        Management
      </div>

      <a href="#" class="nav-side__link">
        <span>◉</span>
        <span>Attendance</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>▥</span>
        <span>Reports</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>⚙</span>
        <span>Settings</span>
      </a>

    </nav>


    <!-- Sidebar Bottom -->
    <div class="mt-auto pt-4">

      <div
        class="p-3 rounded-3"
        style="background: var(--bhr-primary-lt);"
      >

        <div
          class="small fw-semibold mb-1"
          style="color: var(--bhr-primary-dk);"
        >
          Need help?
        </div>

        <div class="small text-muted-soft mb-2">
          Contact HR support for assistance.
        </div>

        <a href="#" class="link-bhr small">
          Get support →
        </a>

      </div>

    </div>

  </aside>


  <!-- MAIN APPLICATION -->
  <main class="app-main">

    <!-- TOP NAVBAR -->
    <header class="app-topbar">

      <div class="d-flex align-items-center justify-content-between">
    
        <!-- ============================================
             LEFT SIDE
             ============================================ -->
        <div class="d-flex align-items-center gap-3">
    
          <!-- Sidebar Toggle -->
          <button
            type="button"
            class="btn btn-bhr-ghost p-2"
            aria-label="Toggle sidebar"
            title="Toggle sidebar"
            (click)="toggleSidebar()"
          >
            ☰
          </button>
    
          <!-- Dynamic Page Title -->
          <div>
    
            <h1 class="section-title mb-0">
              {{ pageTitle }}
            </h1>
    
            <div class="small text-muted-soft d-none d-md-block">
              {{ pageSubtitle }}
            </div>
    
          </div>
    
        </div>
    
    
        <!-- ============================================
             RIGHT SIDE — USER PROFILE
             ============================================ -->
        <div class="d-flex align-items-center gap-3">
    
          <!-- Notifications -->
          <button
            type="button"
            class="btn btn-bhr-ghost p-2 d-none d-sm-inline-flex"
            aria-label="Notifications"
            title="Notifications"
          >
            ♢
          </button>
    
    
          <!-- USER PROFILE -->
          <div class="dropdown">
    
            <button
              type="button"
              class="btn btn-bhr-ghost d-flex align-items-center gap-2"
            >
    
              <!-- Avatar -->
              <span
                class="d-inline-flex align-items-center justify-content-center rounded-circle"
                style="
                  width: 34px;
                  height: 34px;
                  background: var(--bhr-primary-lt);
                  color: var(--bhr-primary-dk);
                  font-weight: 700;
                  font-size: .8rem;
                "
              >
                LM
              </span>
    
    
              <!-- User Details -->
              <span class="text-start d-none d-md-block">
    
                <span
                  class="d-block fw-semibold"
                  style="font-size: .85rem;"
                >
                  Leo M.
                </span>
    
                <span
                  class="d-block text-muted-soft"
                  style="font-size: .72rem;"
                >
                  HR Administrator
                </span>
    
              </span>
    
    
              <!-- Dropdown Arrow -->
              <span class="small d-none d-md-inline">
                ▾
              </span>
    
            </button>
    
    
            <!-- ============================================
                 USER DROPDOWN MENU
                 ============================================ -->
            <div
              class="dropdown-menu dropdown-menu-end border-0 mt-2 p-2"
              style="
                min-width: 220px;
                border-radius: var(--bhr-radius);
                box-shadow: var(--bhr-shadow);
              "
            >
    
              <!-- User Information -->
              <div
                class="px-3 py-2 border-bottom mb-2"
                style="border-color: var(--bhr-border) !important;"
              >
    
                <div class="fw-semibold">
                  Leo M.
                </div>
    
                <div class="small text-muted-soft">
                  leo@example.com
                </div>
    
                <div class="small text-muted-soft mt-1">
                  HR Administrator
                </div>
    
              </div>
    
    
              <!-- Profile -->
              <a
                href="#"
                class="dropdown-item rounded-2"
              >
                My Profile
              </a>
    
    
              <!-- Settings -->
              <a
                href="#"
                class="dropdown-item rounded-2"
              >
                Account Settings
              </a>
    
    
              <div class="dropdown-divider"></div>
    
    
              <!-- Logout -->
              <a
                href="#"
                class="dropdown-item rounded-2"
                style="color: var(--bhr-accent);"
              >
                ⇥ &nbsp; Logout
              </a>
    
            </div>
    
          </div>
    
        </div>
    
      </div>
    
    </header>


    <!-- PAGE CONTENT -->
    <section class="app-content">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
