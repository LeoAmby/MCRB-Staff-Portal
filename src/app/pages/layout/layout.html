<div class="d-flex" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- SIDEBAR -->
  <aside class="app-sidebar">

    <!-- Brand -->
    <div class="d-flex align-items-center justify-content-between mb-4 px-2">

      <a href="#" class="brand">
        <span class="brand__mark">MCRB</span>
        <span>Staff Portal</span>
      </a>

    </div>


    <!-- Navigation -->
    <nav class="nav-side">

      <div class="nav-side__label">
        Main
      </div>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-side__link"
      >
        <span>⌂</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/admin/employee-list"
        routerLinkActive="active"
        class="nav-side__link"
      >
        <span>♙</span>
        <span>Employees</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>▣</span>
        <span>Departments</span>
      </a>

      <a
        routerLink="/admin/projects"
        routerLinkActive="active"
        class="nav-side__link"
      >
        <span>▤</span>
        <span>Projects</span>
      </a>


      <div class="nav-side__label">
        Management
      </div>

      <a href="#" class="nav-side__link">
        <span>◉</span>
        <span>Attendance</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>▥</span>
        <span>Reports</span>
      </a>

      <a href="#" class="nav-side__link">
        <span>⚙</span>
        <span>Settings</span>
      </a>

    </nav>


    <!-- Sidebar Bottom -->
    <div class="mt-auto pt-4">

      <div
        class="p-3 rounded-3"
        style="background: var(--bhr-primary-lt);"
      >

        <div
          class="small fw-semibold mb-1"
          style="color: var(--bhr-primary-dk);"
        >
          Need help?
        </div>

        <div class="small text-muted-soft mb-2">
          Contact HR support for assistance.
        </div>

        <a href="#" class="link-bhr small">
          Get support →
        </a>

      </div>

    </div>

  </aside>


  <!-- MAIN APPLICATION -->
  <main class="app-main">

    <!-- TOP NAVBAR -->
    <header class="app-topbar">

      <div class="d-flex align-items-center justify-content-between">

        <!-- LEFT -->
        <div class="d-flex align-items-center gap-3">

          <!-- SIDEBAR TOGGLE -->
          <button
            type="button"
            class="btn btn-bhr-ghost p-2"
            aria-label="Toggle sidebar"
            title="Toggle sidebar"
            (click)="toggleSidebar()"
          >
            ☰
          </button>


          <div>

            <h1 class="section-title">
              Dashboard
            </h1>

            <div class="small text-muted-soft d-none d-md-block">
              Welcome back. Here's what's happening today.
            </div>

          </div>

        </div>


        <!-- RIGHT SIDE -->
        <!-- Keep your existing user/profile code here -->

      </div>

    </header>


    <!-- PAGE CONTENT -->
    <section class="app-content">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
